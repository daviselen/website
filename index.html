<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Davis Elen</title>
    <!-- Preload only the two most-used cuts: Knockout Featherwt is the
         Masthead's 360px above-the-fold headline (the first real content
         paint), and Ringside Light is the site-wide default body weight
         (Layout.jsx sets font-narrow font-light on the page wrapper) and the
         Masthead lede, which is the mobile LCP element. Every other
         cut/weight is used further down the page or more narrowly, so
         preloading them too would just compete with these two for
         bandwidth on first load instead of helping. -->
    <link
      rel="preload"
      href="/fonts/Knockout-68.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/RingsideNarrow-Light.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Masthead video origins. The embed itself is deferred until after
         window load (MastheadVideo.jsx), so warming these connections early
         is what keeps the swap from poster to video quick. -->
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="preconnect" href="https://f.vimeocdn.com" />
    <link rel="preconnect" href="https://vod-adaptive-ak.vimeocdn.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

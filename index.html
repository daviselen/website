<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Davis Elen</title>
    <!-- Preload only the two most-used cuts: Knockout Featherwt is the
         Masthead's 360px above-the-fold headline (the first real content
         paint), and Ringside Book is the site-wide default body weight
         (HomePage.jsx sets font-narrow font-light on the root wrapper). Every other
         cut/weight is used further down the page or more narrowly, so
         preloading them too would just compete with these two for
         bandwidth on first load instead of helping. -->
    <link
      rel="preload"
      href="/fonts/Knockout-68.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/RingsideNarrow-Book.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
